# Ejecución automática: pruebas, ventana y perft en cada push.
#
# Son las comprobaciones que ya existen en el proyecto y que se ejecutan a mano,
# pero que en la práctica no se ejecutaban a mano. Con esto, un error de reglas,
# un fallo de la ventana o una regresión grande de rendimiento la ve el push, no
# la siguiente persona que abra el proyecto.
#
# Lo que se ejecuta:
#
#   xvfb-run -a python -m pytest
#   xvfb-run -a python smoke_ventana.py
#   python perft_ajedrez.py --profundidad 3
#
# Lo del xvfb es por los tests de ventana: `tests/test_ventana.py` abre una `Tk()`
# de verdad, y sin un servidor gráfico no hay ni pantalla ni eventos. En un
# equipo con escritorio (Windows, macOS, Linux con sesión gráfica) `python -m
# pytest` a secas ya funciona, y por eso las pruebas se saltan solas si no hay
# pantalla, en vez de romper la batería entera.
#
# El perft es el que cuesta (unos 50 s aquí, el doble en un runner lento), por
# eso no se repite en cada versión de Python: `pytest` ya incluye pruebas de perft
# en `tests/test_perft.py` (perft(1) y perft(2) en las seis posiciones, y perft(3)
# en las dos baratas), así que la matriz también vigila las reglas.

name: Pruebas

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    # La matriz cubre el mínimo declarado en pyproject.toml (3.10) y la última
    # versión. Probar 3.10 no es un capricho: el bug de `from __future__
    # import annotations` en models/enums.py solo se maniesta antes de la 3.14
    # (en la 3.14 las anotaciones son perezosas por el PEP 649 y el fallo queda
    # oculto), así que la 3.10 es la única forma de que la CI lo detecte.
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Instalar Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # No se instala el proyecto con `pip install -e .` a propósito: no hay
      # backend de empaquetado y no hace falta, porque `pyproject.toml` ya tiene
      # `pythonpath = ["."]` para pytest y el programa se ejecuta desde la raíz.
      - name: Instalar pytest
        run: python -m pip install --upgrade pip pytest

      - name: Comprobar la versión de Python
        run: python -VV

      # `tkinter` no viene con CPython como módulo compilado: hace falta el
      # paquete del sistema. En los runners de Ubuntu suele venir ya, pero no se
      # da por hecho; y si tampoco está en el apt se avisa, porque las pruebas de
      # ventana se saltan solas y el resto de la batería sigue valiendo.
      - name: Tener tkinter
        run: |
          if python -c "import tkinter" 2>/dev/null; then
            echo "tkinter disponible"
          elif sudo apt-get update -qq && sudo apt-get install -y -qq python3-tk; then
            echo "tkinter instalado"
          else
            echo "::warning::no hay tkinter; los tests de ventana se saltaran"
          fi

      - name: Ejecutar las pruebas (con pantalla virtual)
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" python -m pytest

  ventana:
    # La prueba de humo de la ventana: abre el tablero, pulsa casillas con el ratón
    # simulado y comprueba que lo pintado es lo que dice el modelo. No está en la
    # batería de pytest porque necesita la ventana mapeada de verdad.
    name: humo de la ventana
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Instalar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Tener tkinter
        run: |
          if python -c "import tkinter" 2>/dev/null; then
            echo "tkinter disponible"
          elif sudo apt-get update -qq && sudo apt-get install -y -qq python3-tk; then
            echo "tkinter instalado"
          else
            echo "::warning::no hay tkinter; el humo de la ventana se saltara"
          fi

      # El guion saca la ventana de la pantalla y la pone transparente, así que
      # esto no molesta aunque el runner tenga sesión gráfica.
      - name: Ejecutar el humo de la ventana
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" python smoke_ventana.py

  perft:
    # El generador de jugadas contra los valores de referencia de python-chess.
    # `--profundidad 3` a propósito: la profundidad por defecto (4) son 197.281
    # rutas en la posición inicial y 4.085.603 en Kiwipete, y en la práctica
    # son horas. Con la 3, la tabla entera va en menos de un minuto y sigue
    # detectando cualquier error de regla, que es para lo que está.
    name: perft (reglas de movimiento)
    runs-on: ubuntu-latest
    # Es lo que hace de alarma de rendimiento: si la generación de jugadas se
    # degrada mucho, el perft no cabe en diez minutos y el trabajo falla.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Instalar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Ejecutar perft
        run: python perft_ajedrez.py --profundidad 3

      # Lo que la CI NO puede hacer, y conviene no creer que hace: detectar una
      # regresión de rendimiento *fina*. Los tiempos del runner no son
      # comparables entre ejecuciones (varían con la carga de la máquina), así
      # que un umbral de segundos daría falsos positivos que la gente acabaría
      # silenciando. Lo que sí hay:
      #   - el log, que deja los tiempos a la vista para compararlos a ojo,
      #   - el `timeout-minutes` de arriba, que es lo que atrapa una regresión
      #     grande: si la generación de jugadas se degrada x10, el perft se pasa
      #     de los diez minutos y el trabajo falla.
      # Para vigilar el rendimiento de verdad haría falta un benchmark con
      # margen de ruido, no un test: es trabajo aparte.
