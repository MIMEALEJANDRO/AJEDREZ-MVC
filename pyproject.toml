[project]
# Sección mínima: no se empaqueta ni se publica nada, pero declara de forma
# explícita qué es el proyecto y con qué versión de Python se ha probado. Sin
# esto, cualquier herramienta que lea `pyproject.toml` (editores, CI,
# `pip install -e .`) no tiene forma de saber el mínimo requerido.
name = "ajedrez-mvc"
version = "0.1.0"
description = "Ajedrez de consola con arquitectura MVC: modelo sin IO, vistas intercambiables y persistencia en JSON y FEN."
requires-python = ">=3.10"
dependencies = []

[tool.pytest.ini_options]
# `pythonpath = ["."]` es lo que permite que las pruebas hagan
# `from models import Partida` sin instalar el proyecto. Sin esta línea,
# pytest buscaría los módulos en la carpeta de la prueba y no en la raíz.
pythonpath = ["."]
testpaths = ["tests"]

# Se muestran los nombres de las pruebas parametrizadas (las de JSON y FEN se
# repetirían como "test_x[0]" y "test_x[1]", que no dice nada).
addopts = "-v"
